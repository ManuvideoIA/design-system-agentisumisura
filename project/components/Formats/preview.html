<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); }
  .row { display: flex; gap: var(--space-5); align-items: flex-end; flex-wrap: wrap; }
  .f { background: var(--brand-soft); border: 2px solid var(--line-strong); border-radius: var(--radius-md); height: 200px; display: flex; flex-direction: column; justify-content: space-between; padding: var(--space-3); box-sizing: border-box; }
  .ratio { font: 700 28px/1 var(--font-display); letter-spacing: -0.02em; color: var(--brand-text); }
  .bars i { display: block; height: 8px; border-radius: 4px; background: var(--line-strong); margin-top: 6px; }
  .name { margin-top: var(--space-2); font: 700 14px/20px var(--font-sans); }
  .use { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); }
</style></head>
<body>
  <div class="row">
    <div><div class="f" style="width:112px"><div class="ratio">9:16</div><div class="bars"><i style="width:80%"></i><i style="width:55%"></i></div></div><div class="name">Verticale</div><div class="use">video · storie</div></div>
    <div><div class="f" style="width:160px"><div class="ratio">4:5</div><div class="bars"><i style="width:85%"></i><i style="width:60%"></i></div></div><div class="name">Post</div><div class="use">immagine · testo</div></div>
    <div><div class="f" style="width:200px"><div class="ratio">1:1</div><div class="bars"><i style="width:85%"></i><i style="width:60%"></i></div></div><div class="name">Quadrato</div><div class="use">citazioni</div></div>
    <div><div class="f" style="width:356px"><div class="ratio">16:9</div><div class="bars"><i style="width:60%"></i><i style="width:40%"></i></div></div><div class="name">Orizzontale</div><div class="use">slide · video</div></div>
  </div>
</body></html>
