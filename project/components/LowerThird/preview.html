<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); }
  .frame { position: relative; width: 480px; height: 189px; border-radius: var(--radius-lg); background: var(--brand-soft); overflow: hidden; }
  .label { position: absolute; left: 0; right: 0; top: 24px; text-align: center; font: 400 11px/16px var(--font-mono); color: var(--ink); }
  .bar { position: absolute; left: var(--space-5); bottom: var(--space-5); display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--shadow-lifted); }
  .name { font: 700 16px/20px var(--font-sans); color: var(--ink); }
  .role { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); }
  .tag { padding: 4px var(--space-3); border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent-text); font: 700 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <div class="frame">
    <div class="label">Inquadratura del titolare</div>
    <div class="bar">
      <div><div class="name">Nome Cognome</div><div class="role">Titolare</div></div>
      <span class="tag">Pizzeria</span>
    </div>
  </div>
</body></html>
