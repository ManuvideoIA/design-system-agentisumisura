<!-- @dsCard group="Base" height=110 subtitle="Settore, agente, novità, dato tecnico" -->
<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); }
  .row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
  .tag { display: inline-flex; align-items: center; min-height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font: 700 13px/16px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; }
  .sector { background: var(--accent-soft); color: var(--accent-text); }
  .agent { background: var(--brand-soft); color: var(--brand-text); }
  .new { background: var(--accent); color: var(--on-accent); }
  .tech { border: 2px solid var(--line-strong); color: var(--ink); font: 400 12px/18px var(--font-mono); letter-spacing: 0; text-transform: none; }
</style></head>
<body>
  <div class="row">
    <span class="tag sector">Pizzeria</span>
    <span class="tag sector">Ferramenta</span>
    <span class="tag sector">E-commerce</span>
    <span class="tag agent">Agente IA</span>
    <span class="tag new">Nuovo</span>
    <span class="tag tech">Settore · Negozio</span>
  </div>
</body></html>
