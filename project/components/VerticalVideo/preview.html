<!-- @dsCard group="Video" height=470 subtitle="Video 9:16: apertura e fotogramma con sottotitoli (margini tratteggiati)" -->
<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); display: flex; gap: var(--space-5); flex-wrap: wrap; align-items: flex-start; }
  .frame { position: relative; width: 216px; height: 384px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-soft); }
  .safe { position: absolute; left: 8%; right: 8%; top: 14%; bottom: 22%; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); pointer-events: none; }
  .open { background: var(--brand); color: var(--on-brand); }
  .open .safe { border-color: var(--on-brand); }
  .open .hook { position: absolute; left: 8%; right: 8%; top: 14%; font: 700 36px/37px var(--font-display); letter-spacing: -0.02em; }
  .open mark { background: var(--accent); color: var(--on-accent); padding: 0 var(--space-1); border-radius: var(--radius-sm); }
  .scene { background: var(--brand-soft); }
  .scene .label { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font: 400 11px/16px var(--font-mono); color: var(--ink); }
  .cap { position: absolute; left: 12%; right: 12%; bottom: 24%; background: var(--ink); color: var(--surface); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font: 700 17px/20px var(--font-sans); text-align: center; }
  .bug { position: absolute; right: 8%; bottom: 6%; font: 700 11px/1 var(--font-display); letter-spacing: -0.02em; color: var(--ink); }
  .open .bug { color: var(--on-brand); }
  .note { width: 216px; margin-top: var(--space-2); font: 400 11px/16px var(--font-mono); color: var(--ink-muted); }
</style></head>
<body>
  <div>
    <div class="frame open">
      <div class="safe"></div>
      <div class="hook">Le email non <mark>aspettano</mark>.</div>
      <div class="bug">Agenti su Misura</div>
    </div>
    <div class="note">Apertura</div>
  </div>
  <div>
    <div class="frame scene">
      <div class="safe"></div>
      <div class="label">Inquadratura del titolare</div>
      <div class="cap">Rispondo la sera, quando chiudo.</div>
      <div class="bug">Agenti su Misura</div>
    </div>
    <div class="note">Fotogramma con sottotitolo</div>
  </div>
</body></html>
