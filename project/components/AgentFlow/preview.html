<!-- @dsCard group="Marchio" height=350 subtitle="Cosa entra, cosa fa l'agente, cosa esce" -->
<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); }
  svg { display: block; width: 100%; max-width: 720px; height: auto; }
  .node { fill: var(--surface-raised); stroke: var(--line-strong); stroke-width: 2; }
  .agent { fill: var(--brand); }
  .t { font: 700 15px var(--font-sans); fill: var(--ink); }
  .ts { font: 400 11px var(--font-mono); fill: var(--ink-muted); }
  .ta { font: 700 22px var(--font-display); fill: var(--on-brand); }
  .tsa { font: 400 11px var(--font-mono); fill: var(--on-brand); }
  .link { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  .dot { fill: var(--accent); }
  .pill { fill: var(--accent); }
  .tp { font: 700 11px var(--font-sans); fill: var(--on-accent); letter-spacing: .06em; }
</style></head>
<body>
  <svg viewBox="0 0 720 300" role="img" aria-label="Email, chat e ordini entrano in un agente IA. Escono una risposta pronta, una scheda cliente e un avviso.">
    <path class="link" d="M192 60C232 60 232 150 272 150"/><path class="link" d="M192 150H272"/><path class="link" d="M192 240C232 240 232 150 272 150"/>
    <path class="link" d="M448 150C488 150 488 60 528 60"/><path class="link" d="M448 150H528"/><path class="link" d="M448 150C488 150 488 240 528 240"/>
    <circle class="dot" cx="192" cy="60" r="5"/><circle class="dot" cx="192" cy="150" r="5"/><circle class="dot" cx="192" cy="240" r="5"/>
    <circle class="dot" cx="528" cy="60" r="5"/><circle class="dot" cx="528" cy="150" r="5"/><circle class="dot" cx="528" cy="240" r="5"/>

    <rect class="node" x="16" y="32" width="176" height="56" rx="12"/><text class="t" x="32" y="56">Email</text><text class="ts" x="32" y="75">dei clienti</text>
    <rect class="node" x="16" y="122" width="176" height="56" rx="12"/><text class="t" x="32" y="146">Chat</text><text class="ts" x="32" y="165">del negozio</text>
    <rect class="node" x="16" y="212" width="176" height="56" rx="12"/><text class="t" x="32" y="236">Ordini</text><text class="ts" x="32" y="255">e-commerce</text>

    <rect class="agent" x="272" y="92" width="176" height="116" rx="20"/>
    <text class="ta" x="360" y="146" text-anchor="middle">Agente IA</text>
    <text class="tsa" x="360" y="170" text-anchor="middle">lavora al posto tuo</text>

    <rect class="node" x="528" y="32" width="176" height="56" rx="12"/><text class="t" x="544" y="56">Risposta pronta</text><text class="ts" x="544" y="75">bozza da approvare</text>
    <rect class="node" x="528" y="122" width="176" height="56" rx="12"/><text class="t" x="544" y="146">Scheda cliente</text><text class="ts" x="544" y="165">richiesta salvata</text>
    <rect class="node" x="528" y="212" width="176" height="56" rx="12"/><text class="t" x="544" y="236">Avviso a te</text><text class="ts" x="544" y="255">se serve decidere</text>

    <rect class="pill" x="584" y="4" width="120" height="22" rx="11"/><text class="tp" x="644" y="19" text-anchor="middle">DECIDI TU</text>
  </svg>
</body></html>
