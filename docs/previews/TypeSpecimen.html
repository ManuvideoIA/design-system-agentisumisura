<!-- @dsCard group="Fondamenta" height=450 subtitle="Baskervville, Space Grotesk, Figtree (come Shegöne)" -->
<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); }
  .wrap { display: grid; grid-template-columns: 220px 1fr; gap: var(--space-6); align-items: start; }
  .big { font: 400 180px/0.9 var(--font-editorial, 'Baskervville', Georgia, serif); color: var(--brand-text); letter-spacing: -0.01em; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
  .row small { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }
  .xl { font: 400 44px/46px var(--font-editorial, 'Baskervville', Georgia, serif); letter-spacing: -0.01em; }
  .md { font: 700 28px/32px var(--font-display); letter-spacing: -0.01em; }
  .lg { font: 400 18px/28px var(--font-sans); }
  .lab { font: 700 13px/16px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--brand-text); }
  .dat { font: 700 22px/28px var(--font-mono); }
  mark { background: var(--accent); color: var(--on-accent); padding: 0 var(--space-2); border-radius: var(--radius-sm); }
</style><style id="ds-vars">@font-face{font-family:"Space Grotesk";src:url("../fonts/SpaceGrotesk-VariableFont_wght.ttf") format("truetype");font-weight:300 700;font-style:normal;font-display:swap}@font-face{font-family:"Baskervville";src:url("../fonts/Baskervville-VariableFont_wght.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:swap}@font-face{font-family:"Baskervville";src:url("../fonts/Baskervville-Italic-VariableFont_wght.ttf") format("truetype");font-weight:400 700;font-style:italic;font-display:swap}@font-face{font-family:"Figtree";src:url("../fonts/Figtree-VariableFont_wght.ttf") format("truetype");font-weight:300 900;font-style:normal;font-display:swap}@font-face{font-family:"Figtree";src:url("../fonts/Figtree-Italic-VariableFont_wght.ttf") format("truetype");font-weight:300 900;font-style:italic;font-display:swap}@font-face{font-family:"Space Mono";src:url("../fonts/SpaceMono-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Space Mono";src:url("../fonts/SpaceMono-Italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:"Space Mono";src:url("../fonts/SpaceMono-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:"Space Mono";src:url("../fonts/SpaceMono-BoldItalic.ttf") format("truetype");font-weight:700;font-style:italic;font-display:swap}:root{--surface:#f6f2ea;--surface-raised:#fffdf8;--ink:#0f1f23;--ink-muted:#4a5b60;--line:#dcd6c8;--line-strong:#8a8a80;--brand:#497a84;--on-brand:#fffdf8;--brand-text:#3d6a73;--brand-soft:#dfeaec;--accent:#8cc5ae;--on-accent:#0f1f23;--accent-text:#2e6b4f;--accent-soft:#e3f1ea;--focus:var(--brand-text);--font-display:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;--font-editorial:"Baskervville", Georgia, "Times New Roman", serif;--font-sans:"Figtree", "Helvetica Neue", Arial, sans-serif;--font-mono:"Space Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;--shadow-soft:0 1px 2px rgba(15, 31, 35, 0.08), 0 8px 24px rgba(15, 31, 35, 0.10);--shadow-lifted:0 2px 4px rgba(15, 31, 35, 0.12), 0 16px 40px rgba(15, 31, 35, 0.18)}
:root[data-theme=dark]{color-scheme:dark;--surface:#0c171a;--surface-raised:#142328;--ink:#f4efe6;--ink-muted:#a9bcc1;--line:#203338;--line-strong:#6b858c;--brand:#6aa3af;--on-brand:#0c171a;--brand-text:#6aa3af;--brand-soft:#17323a;--accent:#9ad2bb;--on-accent:#0c171a;--accent-text:#9ad2bb;--accent-soft:#17332a;--focus:var(--brand-text);--shadow-soft:0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);--shadow-lifted:0 2px 4px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.55)}</style><script>(function(){var d=document.documentElement;
function set(t){d.setAttribute('data-theme',t)}
var s=null;try{s=localStorage.getItem('ds-theme')}catch(e){}
set(s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
addEventListener('message',function(e){if(e.data&&e.data.theme)set(e.data.theme)});})();</script></head>
<body>
  <div class="wrap">
    <div class="big">Aa</div>
    <div>
      <div class="row"><span class="xl"><mark>Sosia</mark>.</span><small>display-xl</small></div>
      <div class="row"><span class="md">Tre domande sul tuo lavoro.</span><small>display-md</small></div>
      <div class="row"><span class="lg">L'agente fa il lavoro ripetitivo. Tu decidi.</span><small>body-lg</small></div>
      <div class="row"><span class="lab">Agente IA · Novità</span><small>label</small></div>
      <div class="row"><span class="dat">01 — 02 — 03</span><small>data-lg</small></div>
    </div>
  </div>
</body></html>
