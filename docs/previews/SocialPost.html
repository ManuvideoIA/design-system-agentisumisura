<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); display: flex; gap: var(--space-5); flex-wrap: wrap; }
  .post { width: 288px; height: 360px; box-sizing: border-box; padding: var(--space-5); border-radius: var(--radius-lg); display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-soft); }
  .light { background: var(--surface-raised); color: var(--ink); border: 1px solid var(--line); }
  .teal { background: var(--brand); color: var(--on-brand); }
  .night { background: var(--ink); color: var(--surface); }
  .kicker { font: 700 11px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .light .kicker { color: var(--ink-muted); }
  h2 { margin: 0; font: 400 32px/34px var(--font-editorial, 'Baskervville', Georgia, serif); letter-spacing: -0.01em; }
  mark { background: var(--accent); color: var(--on-accent); padding: 0 var(--space-2); border-radius: var(--radius-sm); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .mark { display: block; --lg-h: 22px; }
  .lg img { display: none; height: var(--lg-h, 24px); width: auto; }
  .lg img.lg-fix { display: block; }
  .gl .lg-light, .gk .lg-dark { display: block; }
  :root[data-theme=dark] .gl .lg-light, :root[data-theme=dark] .gk .lg-dark { display: none; }
  :root[data-theme=dark] .gl .lg-dark, :root[data-theme=dark] .gk .lg-light { display: block; }
  .lg.gl, .lg.gk, .lg.lgb { display: inline-flex; align-items: center; gap: calc(var(--lg-h, 24px) * .3); }
  .lg-name { font: 700 calc(var(--lg-h, 24px) * .8)/1 var(--font-display); letter-spacing: -0.02em; white-space: nowrap; }
  .gl .lg-name { color: var(--ink); } .gk .lg-name { color: var(--surface); } .lgb .lg-name { color: var(--on-brand); }
  .pill { font: 700 12px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; padding: 10px var(--space-4); border-radius: var(--radius-pill); }
  .light .pill { background: var(--brand); color: var(--on-brand); }
  .teal .pill { background: var(--surface-raised); color: var(--ink); }
  .night .pill { background: var(--accent); color: var(--on-accent); }
  .sec { margin: var(--space-3) 0 0; font: 400 11px/16px var(--font-sans); text-align: center; color: var(--accent-text); }

Mono", "Cascadia Code", Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;--shadow-soft:0 1px 2px rgba(15, 31, 35, 0.08), 0 8px 24px rgba(15, 31, 35, 0.10);--shadow-lifted:0 2px 4px rgba(15, 31, 35, 0.12), 0 16px 40px rgba(15, 31, 35, 0.18)}
:root[data-theme=dark]{color-scheme:dark;--surface:#0c171a;--surface-raised:#142328;--ink:#f4efe6;--ink-muted:#a9bcc1;--line:#203338;--line-strong:#6b858c;--brand:#6aa3af;--on-brand:#0c171a;--brand-text:#6aa3af;--brand-soft:#17323a;--accent:#9ad2bb;--on-accent:#0c171a;--accent-text:#9ad2bb;--accent-soft:#17332a;--focus:var(--brand-text);--shadow-soft:0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);--shadow-lifted:0 2px 4px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.55)}</style><script>(function(){var d=document.documentElement;
