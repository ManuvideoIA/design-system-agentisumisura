<!-- @dsCard group="Social" height=430 subtitle="Post 4:5: chiaro, petrolio, notte" -->
<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); display: flex; gap: var(--space-5); flex-wrap: wrap; }
  .post { width: 288px; height: 360px; box-sizing: border-box; padding: var(--space-5); border-radius: var(--radius-lg); display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-soft); }
  .light { background: var(--surface-raised); color: var(--ink); border: 1px solid var(--line); }
  .teal { background: var(--brand); color: var(--on-brand); }
  .night { background: var(--ink); color: var(--surface); }
  .kicker { font: 500 11px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .light .kicker { color: var(--ink-muted); }
  h2 { margin: 0; font: 400 32px/34px var(--font-editorial, 'Baskervville', Georgia, serif); letter-spacing: -0.01em; }
  mark { background: var(--accent); color: var(--on-accent); padding: 0 var(--space-2); border-radius: var(--radius-sm); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .mark { font: 700 15px/1 var(--font-display); letter-spacing: -0.02em; }
  .pill { font: 700 12px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; padding: 10px var(--space-4); border-radius: var(--radius-pill); }
  .light .pill { background: var(--brand); color: var(--on-brand); }
  .teal .pill { background: var(--surface-raised); color: var(--ink); }
  .night .pill { background: var(--accent); color: var(--on-accent); }
  .sec { margin: var(--space-3) 0 0; font: 400 11px/16px var(--font-sans); text-align: center; color: var(--accent-text); }
</style><style id="ds-vars">:root{--surface:#f6f2ea;--surface-raised:#fffdf8;--ink:#0f1f23;--ink-muted:#4a5b60;--line:#dcd6c8;--line-strong:#8a8a80;--brand:#497a84;--on-brand:#fffdf8;--brand-text:#3d6a73;--brand-soft:#dfeaec;--accent:#8cc5ae;--on-accent:#0f1f23;--accent-text:#2e6b4f;--accent-soft:#e3f1ea;--focus:var(--brand-text);--font-display:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;--font-editorial:"Baskervville", Georgia, "Times New Roman", serif;--font-sans:"Figtree", "Helvetica Neue", Arial, sans-serif;--font-mono:ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;--shadow-soft:0 1px 2px rgba(15, 31, 35, 0.08), 0 8px 24px rgba(15, 31, 35, 0.10);--shadow-lifted:0 2px 4px rgba(15, 31, 35, 0.12), 0 16px 40px rgba(15, 31, 35, 0.18)}
:root[data-theme=dark]{color-scheme:dark;--surface:#0c171a;--surface-raised:#142328;--ink:#f4efe6;--ink-muted:#a9bcc1;--line:#203338;--line-strong:#6b858c;--brand:#6aa3af;--on-brand:#0c171a;--brand-text:#6aa3af;--brand-soft:#17323a;--accent:#9ad2bb;--on-accent:#0c171a;--accent-text:#9ad2bb;--accent-soft:#17332a;--focus:var(--brand-text);--shadow-soft:0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);--shadow-lifted:0 2px 4px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.55)}</style><script>(function(){var d=document.documentElement;
function set(t){d.setAttribute('data-theme',t)}
var s=null;try{s=localStorage.getItem('ds-theme')}catch(e){}
set(s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
addEventListener('message',function(e){if(e.data&&e.data.theme)set(e.data.theme)});})();</script></head>
<body>
  <article class="post light">
    <div class="kicker">Il problema</div>
    <div>
      <h2>Le email non aspettano che tu <mark>finisca</mark> il turno.</h2>
      <p class="sec">I dati sensibili sono una priorità: decidiamo insieme come proteggerli.</p>
    </div>
    <div class="foot"><span class="mark">Alterego</span><span class="pill">Scrivimi</span></div>
  </article>
  <article class="post teal">
    <div class="kicker">Come funziona</div>
    <h2>L'agente ordina le richieste. Tu decidi la <mark>risposta</mark>.</h2>
    <div class="foot"><span class="mark">Alterego</span><span class="pill">Scopri come</span></div>
  </article>
  <article class="post night">
    <div class="kicker">La prova</div>
    <h2>Una prova su un solo <mark>compito</mark>.</h2>
    <div class="foot"><span class="mark">Alterego</span><span class="pill">Prenota</span></div>
  </article>
</body></html>
